<head>
    <meta charset="UTF-8">
    <title>Web Clock</title>
    <link rel="icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="apple-touch-icon-180x180.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Akshar:wght@300..700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded&icon_names=fullscreen,fullscreen_exit,home,pause,play_arrow,restart_alt,settings,timer" />

    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <script type="importmap">
        {
            "imports": {
                "@material/web/": "https://esm.run/@material/web/"
            }
        }
    </script>
    <script type="module">
        import '@material/web/all.js';
        import { styles as typescaleStyles } from '@material/web/typography/md-typescale-styles.js';

        document.adoptedStyleSheets.push(typescaleStyles.styleSheet);
    </script>
    <script src="script.js" defer></script>

    <link rel="stylesheet" href="style.css" type="text/css">


</head>

<body>
    <div style="width: 100%;">

        <div style="position: absolute; width: 100%; height: 100%; top: 0px; left: 0px;">
            <div class="home" id="home" style="display: null;">
                <div class="clock_frame">
                    <h1 class="time" id="time">--:--:--</h1>
                    <h2 class="date" id="date">----:--:--</h2>
                </div>
            </div>
            <div class="stopwatch" id="stopwatch" style="display: none;">
                <div class="clock_frame">
                    <div style="display: flex;align-items: baseline;">
                        <h1 class="stopwatch" id="stopwatch_time">0:00</h1>
                        <h2 class="stopwatch_ms" id="stopwatch_ms" style="width: 100px;">.00</h2>
                    </div>
                    <div>
                        <md-outlined-button inline-icon onclick="start_stop_stopwatch()">
                            <span slot="icon" id="play-button" style="width: 24px; height: 24px;"
                                class="material-symbols-rounded">
                                play_arrow
                            </span>

                            <span id="play-button-text">開始</span>
                        </md-outlined-button>

                        <md-outlined-button inline-icon onclick="reset_stopwatch()">
                            <span slot="icon" id="reset-button" style="width: 24px; height: 24px;"
                                class="material-symbols-rounded">
                                restart_alt
                            </span>
                            <span>リセット</span>
                        </md-outlined-button>
                    </div>
                </div>
            </div>

            <div class="settings" id="settings"
                style="display: none; position: absolute; top: 100px; left: 0px; width: 100%">
                <div style="max-width: 500px;align-items: center;justify-content: center;margin: auto;">
                    <md-list>
                        <md-list-item>
                            テキストサイズ
                            <md-slider id="setting,1" slot="end" min="5" max="100" value="25"></md-slider>
                        </md-list-item>
                        <md-list-item>
                            色合い
                            <md-slider id="setting,2" slot="end" min="0" max="360" value="0"></md-slider>
                        </md-list-item>
                        <md-list-item>
                            <md-outlined-button inline-icon onclick="apply_settings()">
                                適用
                            </md-outlined-button>
                        </md-list-item>
                    </md-list>
                </div>
            </div>
        </div>

        <div style="visibility: visible; position: absolute; top: 0px; left: 0px; width: 100%">
            <div>
                <md-tabs id="tabs" activeindex="0">
                    <md-primary-tab inline-icon onclick="home_tab()">
                        <span class="material-symbols-rounded">
                            home
                        </span>
                        ホーム
                    </md-primary-tab>
                    <md-primary-tab inline-icon onclick="stopwatch_tab()">
                        <span class="material-symbols-rounded">
                            timer
                        </span>
                        ストップウォッチ
                    </md-primary-tab>
                    <md-primary-tab inline-icon onclick="settings_tab()">
                        <span class="material-symbols-rounded">
                            settings
                        </span>
                        設定
                    </md-primary-tab>
            </div>
            <div>
                </md-tabs>
                <md-outlined-button onclick="fullscreen()">
                    <span id="fullscreen_button" class="material-symbols-rounded">
                        fullscreen
                    </span>
                </md-outlined-button>
            </div>
        </div>
    </div>
</body>
